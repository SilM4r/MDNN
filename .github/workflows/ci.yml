name: CI

# Fáze 6 roadmapy: gradient checky jsou hlavní pojistka správnosti knihovny,
# takže musí běžet automaticky, ne jen když si na ně někdo vzpomene.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux je case-sensitive → chytá překlepy v cestách, které na macOS/Windows projdou.
      # Windows je cílová platforma GPU cesty (gpu.dll).
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore MDNN/MDNN.sln

      - name: Build (Release)
        run: dotnet build MDNN/MDNN.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test MDNN/MDNN.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn

      # Balíčky se jen sestaví, ať se chyba v metadatech (README, závislosti) ukáže hned.
      # Publikuje se ručně — CI nikam nic neposílá.
      - name: Pack (bez publikování)
        run: dotnet pack MDNN/MDNN.sln --configuration Release --no-build --output packages

  # Příklady z repozitáře MDNN_examples proti TÉHLE verzi knihovny. Tři chyby v knihovně
  # se dřív našly až ručním spuštěním příkladů — tohle je chytí při každém pushi.
  examples:
    name: examples (MDNN_examples)
    runs-on: ubuntu-latest

    steps:
      # Rozložení, které projekt příkladů čeká: obě repa vedle sebe, knihovna jako MDNN/MDNN.
      - name: Checkout MDNN
        uses: actions/checkout@v7
        with:
          path: MDNN/MDNN

      - name: Checkout MDNN_examples
        uses: actions/checkout@v7
        with:
          repository: SilM4r/MDNN_examples
          path: MDNN_examples

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build examples
        run: MDNN/MDNN/tools/build_examples.sh MDNN_examples
