name: CI

# Gradient checks are the library's main correctness safeguard,
# so they must run automatically, not only when someone remembers to run them.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Linux is case-sensitive → catches path typos that pass on macOS/Windows.
      # Windows is the target platform of the GPU path (gpu.dll).
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore MDNN/MDNN.sln

      - name: Build (Release)
        run: dotnet build MDNN/MDNN.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test MDNN/MDNN.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn

      # Packages are only built, so a metadata error (README, dependencies) shows up immediately.
      # Publishing is manual; CI does not push anything anywhere.
      - name: Pack (no publishing)
        run: dotnet pack MDNN/MDNN.sln --configuration Release --no-build --output packages

  # Examples from the MDNN_examples repository built against THIS version of the library. Three
  # library bugs were previously found only by running the examples by hand; this catches them on every push.
  examples:
    name: examples (MDNN_examples)
    runs-on: ubuntu-latest

    steps:
      # Layout the examples project expects: both repos side by side, the library as MDNN/MDNN.
      - name: Checkout MDNN
        uses: actions/checkout@v7
        with:
          path: MDNN/MDNN

      - name: Checkout MDNN_examples
        uses: actions/checkout@v7
        with:
          repository: SilM4r/MDNN_examples
          path: MDNN_examples

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build examples
        run: MDNN/MDNN/tools/build_examples.sh MDNN_examples
